<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Average Calculator</title>
</head>

<body>

    <form oninput="avg.value=(parseInt(m1.value)+parseInt(m2.value)+parseInt(m3.value))/3">

        <fieldset>
            <legend><b>Enter your Marks</b></legend>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Student Name"><br><br>

            <label>Enter Marks:</label><br>

            <select name="subject1" id="subject1">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
            </select>
            <input type="number" id="m1" name="m1" value="0"><br><br>

            <select name="subject2" id="subject2">
                <option value="English" selected>English</option>
                <option value="Maths">Maths</option>
                <option value="Science">Science</option>
            </select>
            <input type="number" id="m2" name="m2" value="0"><br><br>

            <select name="subject3" id="subject3">
                <option value="Science" selected>Science</option>
                <option value="Maths">Maths</option>
                <option value="English">English</option>
            </select>
            <input type="number" id="m3" name="m3" value="0"><br><br>

            <b>Average:</b> <output name="avg" for="m1 m2 m3">0</output>

        </fieldset>

    </form>

</body>

</html>
